services:
  redis:
    image: redis:7.4-alpine
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 3s
      timeout: 2s
      retries: 20

  worker:
    build: .
    command: python -u app/worker.py
    environment:
      REDIS_HOST: redis
      WORK_SECONDS: ${WORK_SECONDS:-2}
    depends_on:
      redis:
        condition: service_healthy

  producer:
    build: .
    profiles: ["tools"]
    command: python -u app/producer.py
    environment:
      REDIS_HOST: redis
    depends_on:
      redis:
        condition: service_healthy

  status:
    build: .
    profiles: ["tools"]
    command: python -u app/status.py
    environment:
      REDIS_HOST: redis
    depends_on:
      redis:
        condition: service_healthy

volumes:
  redis-data:
